[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rongwei-automotive-sales-plugin"
version = "0.1.0"
description = "Evidence-led automotive export sales tools for Chinese AI platforms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]
deepseek = ["openai>=1.30,<3"]
providers = ["openai>=1.30,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/rongwei_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
