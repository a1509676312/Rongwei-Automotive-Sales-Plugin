[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rongwei-automotive-sales-plugin"
version = "0.1.0"
description = "Model-agnostic automotive export sales tools for Chinese AI platforms"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rongwei Automotive Sales Plugin Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
deepseek = ["openai>=1.0,<3"]
secure-storage = ["cryptography>=43.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
